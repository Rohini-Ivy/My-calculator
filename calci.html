<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
    display: flex;
    margin : 0;
    justify-content: center;
    align-items: center;
    height : 100vh;
    background-color: hsl(0, 0%, 95%);
}

#buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 25px;
}
#calculator {
    display: flex;
    flex-direction: column;
    align-items: center;
font-family: Arial, sans-serif;
background-color: hsl(0, 0%, 82%);
max-width: 500px;
overflow:hidden;
border-radius: 15px;
}
button {
    width : 80px;
    height : 60px;
    border-radius: 40px;
    border: none;
    background-color: hsl(0, 1%, 36%);
    color: white;
    font-size: 2rem;
    font-weight: bold;
    cursor: pointer;
}
#display {
    width: 100%;
    height: 60px;
    padding : 10px 20px;
    font-size:2rem ;
    text-align: right;
    border : none;
    box-sizing: border-box;
    vertical-align: top;
    background-color: hsl(210, 41%, 68%);
}
.delete-bin {
    background-color: hsl(160, 50%, 38%); 
    display: block;
    align-items: center;
    justify-content: center;
}
.equal-bin {
    background-color: hsl(120,60%,50%);
    color: white;
}


button:hover{
    background-color: hsl(0, 0%, 40%);
}
button:active{
    background-color: hsl(0, 0%, 50%);
}
.operator-btn{
    background-color: hsl(35,100%,55%);
}
.operator-btn:hover{
    background-color: hsl(35,100%,65%);

}
.operator-btn:active{
    background-color: hsl(35,100%,75%);
}
    </style>
    <title>My Calculator</title>
</head>
<body>
    <div id ="calculator">
        <input type=" text" id="display" readonly placeholder="0">
        <div id="buttons">
            <button onclick="clearDisplay()"class="operator-btn">C</button>
            <button onclick ="deleteLastDigit()" class="operator-btn delete-bin">&#9003</button>
            <button onclick="appendToDisplay('%')"class="operator-btn">%</button>
            <button onclick="appendToDisplay('/')"class="operator-btn">/</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('*')"class="operator-btn">*</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('-')"class="operator-btn">-</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('+')"class="operator-btn">+</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
        <button onclick="appendToDisplay('()')">()</button>
            <button onclick="calculate()" class=" equal-bin">=</button>
    
        </div>
        </div>
        <script>
            // calculator program

const display = document.getElementById("display");

function appendToDisplay(input){
    display.value += input;
}

function clearDisplay(){
display.value="";
}
function calculate(){
    try{
display.value = eval(display.value);
    }
    catch(error){
        display.value ="error";
    }

}
 function deleteLastDigit(){
    display.value = display.value.slice(0,-1);
 }
        </script>
    
</body>
</html>
