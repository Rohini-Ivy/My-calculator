<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>
<link rel="stylesheet" href="calci.css">
    </head>
    </body>

<div id="calculator">

    <input type="text" id="display" readonly placeholder="0">

    <div id="buttons">

        <button onclick="clearDisplay()" class="operator-btn">C</button>
        <button onclick="deleteLastDigit()" class="operator-btn delete-bin">&#9003;</button>
        <button onclick="appendToDisplay('%')" class="operator-btn">%</button>
        <button onclick="appendToDisplay('/')" class="operator-btn">/</button>

        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button onclick="appendToDisplay('*')" class="operator-btn">*</button>

        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button onclick="appendToDisplay('-')" class="operator-btn">-</button>

        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button onclick="appendToDisplay('+')" class="operator-btn">+</button>

        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="appendToDisplay('.')">.</button>
        <button onclick="appendToDisplay('(')">(</button>
        <button onclick="appendToDisplay(')')">)</button>

        <button onclick="calculate()" class="equal-bin">=</button>
        <button onclick="squareRoot()" class="math-btn">√</button>
        <button onclick="square()" class="math-btn">x²</button>
        <button onclick="power()" class="math-btn">xʸ</button>

        <button onclick="factorial()" class="math-btn">x!</button>
        <button onclick="reciprocal()" class="math-btn">1/x</button>
        <button onclick="logarithm()" class="math-btn">log</button>
        <button onclick="naturalLog()" class="math-btn">ln</button>

    </div>
</div>
<script src= "calci.js"></script>


</body>
</html>
